version: "2"

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  default: none
  enable:
    - durationcheck
    - errcheck
    - copyloopvar
    - forcetypeassert
    - godot
    - ineffassign
    - makezero
    - misspell
    - nilerr
    - predeclared
    - staticcheck
    - unconvert
    - unparam
    - unused
    - govet
  settings:
    errcheck:
      exclude-functions:
        # Closing HTTP response bodies after a full read is best-effort;
        # errors there are neither actionable nor reportable to callers.
        - (net/http.Response).Close
        - (io.Closer).Close

formatters:
  enable:
    - gofmt

run:
  timeout: 5m
